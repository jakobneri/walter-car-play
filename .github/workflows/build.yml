name: Build APK

on:
  push:
    branches: [ main, "claude/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Install Android SDK platform 34
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: walter-car-play-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      # Bei einem Tag (z.B. v1.0) → GitHub Release mit APK erstellen
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Walter CarPlay ${{ github.ref_name }}
          body: |
            ## Installation
            1. `app-debug.apk` herunterladen
            2. Auf dem Android-Handy öffnen → installieren
            3. App starten, Batterie-Optimierung deaktivieren, fertig!
